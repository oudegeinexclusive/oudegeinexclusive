<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bedankt – Oudegein Exclusive</title>
  <meta name="robots" content="noindex, follow">
  <style>
    :root{--beige-licht:#F4EDE3;--taupe:#8B7B6F;--taupe-donker:#6B5F53;--bruin:#3D322A;--tekst:#2C2418;--subtekst:#7A6B5E;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Helvetica Neue',Arial,sans-serif;background:#FAFAF8;color:var(--tekst);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;line-height:1.7;}
    .kaart{max-width:520px;text-align:center;background:#fff;border:1px solid var(--beige-licht);border-radius:6px;padding:3rem 2.4rem;box-shadow:0 8px 40px rgba(107,95,83,0.10);}
    .vink{width:64px;height:64px;border-radius:50%;background:var(--beige-licht);display:flex;align-items:center;justify-content:center;margin:0 auto 1.6rem;}
    .vink svg{stroke:var(--taupe-donker);}
    h1{font-family:'Georgia',serif;font-weight:normal;font-size:1.8rem;color:var(--bruin);margin-bottom:0.8rem;}
    p{font-size:0.95rem;color:var(--subtekst);margin-bottom:0.6rem;}
    .knop{display:inline-block;margin-top:1.8rem;padding:0.8rem 2rem;background:var(--taupe);color:#fff;text-decoration:none;font-size:0.8rem;letter-spacing:0.1em;text-transform:uppercase;border-radius:2px;transition:background .2s;}
    .knop:hover{background:var(--taupe-donker);}
    .tel{margin-top:1.4rem;font-size:0.85rem;color:var(--subtekst);}
    .tel a{color:var(--taupe-donker);}
  </style>
</head>
<body>
  <div class="kaart">
    <div class="vink">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1>Bedankt voor uw bericht</h1>
    <p>Wij hebben uw aanvraag in goede orde ontvangen.</p>
    <p>Ons team neemt binnen één werkdag contact met u op.</p>
    <a class="knop" href="index.html">Terug naar de website</a>
    <div class="tel">Liever direct contact? Bel <a href="tel:0644414489">06-444 144 89</a></div>
  </div>
</body>
</html>
